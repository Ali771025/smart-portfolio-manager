name: smart_portfolio_management_system
description: Smart Portfolio Manager Flutter prototype.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2
  fast_immutable_collections: ^11.0.4
  go_router: ^17.2.2
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  fpdart: ^1.1.0
  fl_chart: ^1.2.0
  http: ^1.2.1
  dio: ^5.7.0
  file_picker: ^11.0.2
  intl: ^0.20.2
  skeletonizer: ^2.1.3
  flutter_animate: ^4.5.2
  msgpack_dart: ^1.0.1
  shared_preferences: ^2.3.2
  decimal: ^3.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  riverpod_generator: ^4.0.3
  freezed: ^3.2.5
  json_serializable: ^6.9.3

flutter:
  uses-material-design: true
  fonts:
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/Regular.ttf
          weight: 400
        - asset: assets/fonts/Bold.ttf
          weight: 700
    - family: Roboto
      fonts:
        - asset: assets/fonts/roboto-regular.ttf
        - asset: assets/fonts/roboto-medium.ttf
          weight: 500
        - asset: assets/fonts/roboto-bold.ttf
          weight: 700
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Medium.woff2
          weight: 500
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
    - family: DejaVuSans
      fonts:
        - asset: assets/fonts/dejavu-sans.ttf
        - asset: assets/fonts/dejavu-sans-bold.ttf
          weight: 700
